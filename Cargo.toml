[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/adapters-codex",
    "crates/store",
    "crates/session",
    "crates/ui",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["router-switch"]

[workspace.dependencies]
domain = { path = "crates/domain" }
adapters-codex = { path = "crates/adapters-codex" }
store = { path = "crates/store" }
session = { path = "crates/session" }
ui = { path = "crates/ui" }

anyhow = "1"
dirs = "6"
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tempfile = "3"